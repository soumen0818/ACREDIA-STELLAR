# Configuration for cargo-deny
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

# 1. Security advisories & vulnerabilities
[advisories]
ignore = [
    # paste 1.0.15 is an unmaintained transitive dependency of soroban-sdk, tracked in contracts/SECURITY_AUDIT.md F-9
    "RUSTSEC-2024-0436",
    # crypto-bigint 0.5.5 timing variability, a native-only dependency of
    # soroban-env-host (k256/p256 0.13); not in the contract WASM. No Soroban
    # release offers the fix yet. Tracked in contracts/SECURITY_AUDIT.md F-9;
    # drop when soroban-sdk moves to crypto-bigint >= 0.7.6.
    "RUSTSEC-2026-0387",
]

# 2. License compliance
[licenses]
confidence-threshold = 0.5
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
]

[licenses.private]
ignore = true

# 3. Crate bans & version control
[bans]
multiple-versions = "warn"
wildcards = "warn"
deny = []

# 4. Source checking
[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
    "sparse+https://index.crates.io/",
    "https://index.crates.io/",
]
